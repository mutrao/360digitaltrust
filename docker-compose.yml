# =============================================================
# 360DigitalTrust — Stack PKI Microservices
# EJBCA CE | SoftHSM2 | PostgreSQL | Redis | Traefik
# Signature API (PAdES / XAdES / CAdES / TSA / OCSP)
#
# Vault désactivé par défaut — activer avec :
#   docker compose --profile vault up -d
# =============================================================

networks:
  pki-internal:
    driver: bridge
    internal: true
  pki-dmz:
    driver: bridge

volumes:
  ejbca-data:
  ejbca-db-data:
  softhsm-tokens:
  redis-data:
  vault-data:
  traefik-certs:
  crl-files:

services:

  # -----------------------------------------------------------
  # 1. PostgreSQL 16 — Base de données EJBCA
  # -----------------------------------------------------------
  pki-db:
    image: postgres:16-alpine
    container_name: pki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ejbca-db-data:/var/lib/postgresql/data
      - ./pki/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # 2. SoftHSM2 — Simulation HSM PKCS#11
  # En production : remplacer par Thales Luna / Utimaco
  # -----------------------------------------------------------
  pki-hsm:
    build:
      context: ./pki/softhsm
      dockerfile: Dockerfile
    container_name: pki-hsm
    restart: unless-stopped
    environment:
      HSM_PIN: ${CA_TOKEN_PIN}
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------
  # 3. EJBCA CE 8.x — Moteur PKI
  # 8443 : HTTPS admin + REST API
  # 8009 : HTTP CRL + OCSP
  # -----------------------------------------------------------
  pki-ca:
    image: ${EJBCA_IMAGE}
    container_name: pki-ca
    restart: unless-stopped
    depends_on:
      pki-db:
        condition: service_healthy
      pki-hsm:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://${EJBCA_DB_HOST}:${EJBCA_DB_PORT}/${EJBCA_DB_NAME}
      DATABASE_USER: ${EJBCA_DB_USER}
      DATABASE_PASSWORD: ${EJBCA_DB_PASSWORD}
      TLS_SETUP_ENABLED: "simple"
      EJBCA_CLI_DEFAULTPASSWORD: ${EJBCA_ADMIN_PASSWORD}
      CA_KEYSTOREPASS: ${CA_TOKEN_PIN}
      LOG_LEVEL_APP: INFO
      LOG_LEVEL_SERVER: WARN
    volumes:
      - ejbca-data:/mnt/persistent
      - softhsm-tokens:/var/lib/softhsm/tokens
      - ./pki/ejbca/conf:/opt/ejbca/conf:ro
      - ./pki/ejbca/init:/opt/ejbca/init:ro
      - crl-files:/opt/ejbca/crl-out
    ports:
      - "8443:8443"
      - "8009:8080"
    networks:
      - pki-internal
      - pki-dmz
    healthcheck:
      test: ["CMD", "curl", "-skf",
             "https://localhost:8443/ejbca/publicweb/healthcheck/ejbcahealth"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  # -----------------------------------------------------------
  # 4. Nginx — Distribution HTTP des CRL
  # -----------------------------------------------------------
  crl-publisher:
    image: nginx:alpine
    container_name: crl-publisher
    restart: unless-stopped
    volumes:
      - crl-files:/usr/share/nginx/html/crl:ro
      - ./gateway/nginx/crl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pki-dmz

  # -----------------------------------------------------------
  # 5. Redis 7 — Cache OCSP / CRL
  # -----------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: pki-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # 6. Signature API — FastAPI Python
  # PAdES | XAdES | CAdES | TSA | OCSP
  # -----------------------------------------------------------
  signature-api:
    build:
      context: ./signature-api
      dockerfile: Dockerfile
    container_name: signature-api
    restart: unless-stopped
    depends_on:
      pki-ca:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      SECRET_KEY: ${SIG_API_SECRET_KEY}
      EJBCA_REST_URL: ${EJBCA_REST_API_URL}
      EJBCA_ADMIN_PASSWORD: ${EJBCA_ADMIN_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
      # Vault désactivé — activer si le profil vault est utilisé
      VAULT_ADDR: ""
      VAULT_TOKEN: ""
      CRL_BASE_URL: http://crl.${DOMAIN}/crl
      OCSP_URL: http://pki-ca:8009/ejbca/publicweb/status/ocsp
      CA_VERIFY_SSL: "false"
    volumes:
      - crl-files:/app/crl-cache:ro
    ports:
      - "${SIG_API_PORT}:8000"
    networks:
      - pki-internal
      - pki-dmz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # 7. Traefik v3 — Reverse Proxy
  # Dashboard : http://localhost:${TRAEFIK_DASHBOARD_PORT}
  # -----------------------------------------------------------
  gateway:
    image: traefik:v3.0
    container_name: pki-gateway
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - pki-dmz

  # -----------------------------------------------------------
  # 8. Vault — DÉSACTIVÉ PAR DÉFAUT
  # Lancer avec : docker compose --profile vault up -d
  # Problème connu : OOM sur Mac avec peu de RAM
  # -----------------------------------------------------------
  vault:
    profiles: ["vault"]
    image: hashicorp/vault:1.16
    container_name: pki-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev -dev-listen-address=0.0.0.0:8200
    volumes:
      - vault-data:/vault/data
      - ./vault/policies:/vault/policies:ro
    ports:
      - "8200:8200"
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
