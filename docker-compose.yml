# =============================================================
# 360DigitalTrust — Stack PKI Microservices
# EJBCA CE | SoftHSM2 | PostgreSQL | Redis | Vault | Traefik
# Signature API (PAdES/XAdES/CAdES) | CRL Publisher
# =============================================================
version: "3.9"

networks:
  pki-internal:
    driver: bridge
    internal: true
  pki-dmz:
    driver: bridge
  vault-net:
    driver: bridge
    internal: true

volumes:
  ejbca-data:
  ejbca-db-data:
  softhsm-tokens:
  redis-data:
  vault-data:
  vault-logs:
  traefik-certs:
  crl-files:

services:

  # ---------------------------------------------------------
  # 1. BASE DE DONNÉES EJBCA — PostgreSQL 16
  # ---------------------------------------------------------
  pki-db:
    image: postgres:16-alpine
    container_name: pki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ejbca-db-data:/var/lib/postgresql/data
      - ./pki/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------
  # 2. SOFTHSM2 — Simulation HSM PKCS#11 (développement)
  # ---------------------------------------------------------
  pki-hsm:
    build:
      context: ./pki/softhsm
      dockerfile: Dockerfile
    container_name: pki-hsm
    restart: unless-stopped
    environment:
      HSM_PIN: ${CA_TOKEN_PIN}
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD", "softhsm2-util", "--show-slots"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------
  # 3. EJBCA CE 8.x — Moteur PKI
  # ---------------------------------------------------------
  pki-ca:
    image: ${EJBCA_IMAGE}
    container_name: pki-ca
    restart: unless-stopped
    depends_on:
      pki-db:
        condition: service_healthy
      pki-hsm:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://${EJBCA_DB_HOST}:${EJBCA_DB_PORT}/${EJBCA_DB_NAME}
      DATABASE_USER: ${EJBCA_DB_USER}
      DATABASE_PASSWORD: ${EJBCA_DB_PASSWORD}
      TLS_SETUP_ENABLED: "simple"
      EJBCA_CLI_DEFAULTPASSWORD: ${EJBCA_ADMIN_PASSWORD}
      CA_KEYSTOREPASS: ${CA_TOKEN_PIN}
      LOG_LEVEL_APP: INFO
      LOG_LEVEL_SERVER: WARN
    volumes:
      - ejbca-data:/mnt/persistent
      - softhsm-tokens:/var/lib/softhsm/tokens
      - ./pki/ejbca/conf:/opt/ejbca/conf:ro
      - ./pki/ejbca/init:/opt/ejbca/init:ro
      - crl-files:/opt/ejbca/crl-out
    ports:
      - "8443:8443"
      - "8009:8080"
    networks:
      - pki-internal
      - pki-dmz
    healthcheck:
      test: ["CMD", "curl", "-skf",
             "https://localhost:8443/ejbca/publicweb/healthcheck/ejbcahealth"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ---------------------------------------------------------
  # 4. CRL PUBLISHER — Distribution HTTP des révocations
  # ---------------------------------------------------------
  crl-publisher:
    image: nginx:alpine
    container_name: crl-publisher
    restart: unless-stopped
    volumes:
      - crl-files:/usr/share/nginx/html/crl:ro
      - ./gateway/nginx/crl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pki-dmz
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crl.rule=Host(`crl.${DOMAIN}`) || PathPrefix(`/crl`)"
      - "traefik.http.routers.crl.entrypoints=web"
      - "traefik.http.services.crl.loadbalancer.server.port=80"

  # ---------------------------------------------------------
  # 5. REDIS — Cache OCSP + CRL
  # ---------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: pki-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - pki-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # ---------------------------------------------------------
  # 6. VAULT — Gestion des secrets (mode dev local)
  # CORRECTIF : healthcheck via curl sur l'API HTTP
  # Le fichier vault.hcl est incompatible avec -dev, non monté
  # ---------------------------------------------------------
  vault:
    image: hashicorp/vault:1.16
    container_name: pki-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    # -dev : démarre non-scellé, stockage en mémoire, pas besoin de vault.hcl
    command: server -dev
    volumes:
      - vault-logs:/vault/logs
      - ./vault/policies:/vault/policies:ro
      # vault.hcl NOT mounted — incompatible avec le mode -dev
    ports:
      - "8200:8200"
    networks:
      - vault-net
      - pki-internal
    healthcheck:
      # vault status retourne exit 2 quand scellé — utiliser curl à la place
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------
  # 7. SIGNATURE API — Microservice FastAPI
  # PAdES | XAdES | CAdES | Horodatage RFC 3161
  # ---------------------------------------------------------
  signature-api:
    build:
      context: ./signature-api
      dockerfile: Dockerfile
    container_name: signature-api
    restart: unless-stopped
    depends_on:
      pki-ca:
        condition: service_healthy
      cache:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      SECRET_KEY: ${SIG_API_SECRET_KEY}
      EJBCA_REST_URL: ${EJBCA_REST_API_URL}
      EJBCA_ADMIN_PASSWORD: ${EJBCA_ADMIN_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/0
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      CRL_BASE_URL: http://crl.${DOMAIN}/crl
      OCSP_URL: http://pki-ca:8009/ejbca/publicweb/status/ocsp
      CA_VERIFY_SSL: "false"
    volumes:
      - crl-files:/app/crl-cache:ro
    ports:
      - "${SIG_API_PORT}:8000"
    networks:
      - pki-internal
      - pki-dmz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sig-api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.sig-api.entrypoints=websecure"
      - "traefik.http.routers.sig-api.tls=true"
      - "traefik.http.services.sig-api.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------
  # 8. TRAEFIK v3 — Reverse Proxy / Edge Gateway
  # ---------------------------------------------------------
  gateway:
    image: traefik:v3.0
    container_name: pki-gateway
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - pki-dmz
    deploy:
      resources:
        limits:
          memory: 128M
