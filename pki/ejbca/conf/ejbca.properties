# =============================================================
# EJBCA CE — Configuration principale
# Ref: https://doc.primekey.com/ejbca/ejbca-operations/ejbca-configuration
# =============================================================

# --- Interface web ---
ejbca.productionmode=false
httpserver.external.privhttps=8443
httpserver.pubhttps=8443
httpserver.pubhttp=8080

# --- Sécurité ---
# Désactiver les fonctions non utilisées
ejbca.cli.enable=true
web.reqcertindb=true
web.renewalenabled=true

# --- Audit log ---
# Audit intègre obligatoire eIDAS
auditlog.logdevice.0=org.cesecore.audit.impl.integrityprotected.IntegrityProtectedAuditLogDevice
auditlog.exporter.0=org.cesecore.audit.impl.AuditExporterXml

# --- REST API v1 ---
web.reqcertindb=true

# --- Email (désactivé en local) ---
#mail.from=noreply@360digitaltrust.com
#mail.user=
#mail.password=
