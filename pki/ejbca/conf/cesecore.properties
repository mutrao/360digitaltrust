# =============================================================
# CESeCore — Sécurité cryptographique EJBCA
# =============================================================

# Algorithmes autorisés (eIDAS-compatible)
certificate.signalgorithm=SHA256WithRSA;SHA384WithRSA;SHA512WithRSA;SHA256withECDSA;SHA384withECDSA;SHA512withECDSA

# Validation des certificats
certificate.validityoverlap=10m

# Taille minimale des clés
ca.rsakeysize=2048

# OCSP
ocsp.defaultresponderid=
ocsp.signaturealgorithm=SHA256WithRSA;SHA256withECDSA
ocsp.productat=0
ocsp.maxage=30
ocsp.untilnextupdate=3600

# Nonce OCSP (anti-rejeu)
ocsp.acceptnonce=true
ocsp.includenonce=true

# Cache OCSP
ocsp.cache.ttl=30000

# CRL
crl.defaultdeltacrlperiod=1h
crl.defaultcrlperiod=24h
crl.defaultcrlissueinterval=0h
crl.defaultcrloverlaptime=10m
