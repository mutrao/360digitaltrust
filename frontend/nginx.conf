worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Résolveur Docker : permet de démarrer même si signature-api n'est pas
    # encore up, au lieu d'échouer au chargement de la configuration.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── En-têtes de sécurité ──────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # CSP.
        #   'unsafe-inline' sur style-src : Radix UI positionne ses surfaces
        #   flottantes par style inline ; l'interdire casserait les menus et
        #   dialogues. Aucun script inline n'est en revanche autorisé.
        #   connect-src reste large pour permettre de joindre un Keycloak
        #   hébergé sur un autre domaine — restreignez-le au vôtre en production.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: http:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # ── Santé ─────────────────────────────────────────────────
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # ── Configuration runtime ─────────────────────────────────
        # Jamais mise en cache : c'est elle qui porte l'URL du backend et
        # du realm, et elle change d'un déploiement à l'autre.
        location = /config/runtime-config.json {
            add_header Cache-Control "no-store, must-revalidate" always;
            add_header Content-Type application/json;
            try_files $uri =404;
        }

        # ── Proxy vers le service de signature ────────────────────
        location /api/ {
            set $upstream http://signature-api:8000;
            proxy_pass $upstream/;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;

            # Empreintes et certificats : pas de mise en tampon disque.
            proxy_buffering off;
            client_max_body_size 1m;
        }

        # ── Ressources versionnées ────────────────────────────────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA ───────────────────────────────────────────────────
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
