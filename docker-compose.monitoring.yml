# =============================================================
# 360DigitalTrust — Stack Monitoring (optionnelle)
# Prometheus + Grafana + Alertmanager
# Usage :
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.monitoring.yml up -d
# =============================================================
version: "3.9"

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pki-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - pki-dmz
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pki-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pki-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - pki-dmz
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pki-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - monitoring
    ports:
      - "9093:9093"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pki-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pki-db:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - pki-internal
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: pki-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - pki-internal
      - monitoring
    deploy:
      resources:
        limits:
          memory: 32M
